[package]
name = "dsv-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DeepSeek Vision MCP server (native binary): vision pipeline + auto-login + stdio MCP service"
publish = false

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
wasmtime.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rmcp = { version = "2.2", features = ["server", "transport-io", "schemars"] }
base64 = "0.22"
futures-util = "0.3"
bytes = "1"
chromiumoxide = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
