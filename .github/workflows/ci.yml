name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --exclude visionary-zed-ext --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --exclude visionary-zed-ext

  smoke:
    name: MCP smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build visionary-server
        run: cargo build -p visionary-server
      - name: MCP protocol smoke test
        run: |
          python3 scripts/mcp_probe.py smoke target/debug/visionary-server
