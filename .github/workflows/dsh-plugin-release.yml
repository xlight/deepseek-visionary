# 自动发布 DSH 原生插件包 @xlight-oss/visionary-dsh 到 npm
#
# 触发：push tag vX.Y.Z（与 cargo-dist 二进制发布同 tag 触发）
# 流程：版本一致性校验（tag == package.json version == workspace Cargo.toml）
#       → pnpm install（锁文件）→ npm publish（OIDC 免 token）
#
# 前置条件：
#   1. npm Trusted Publisher 已配置（npmjs.com → package → Settings →
#      Trusted Publisher → GitHub Actions）：
#        Organization/user: xlight
#        Repository:        deepseek-visionary
#        Workflow filename: dsh-plugin-release.yml
#      要求 npm CLI >= 11.5.1 且 Node >= 22.14.0（workflow 已升级 npm）
#   2. 打 tag 前确认 packages/dsh-plugin/package.json 的 version 与
#      workspace Cargo.toml 一致（workflow 会校验并失败）
#   3. 首次发布需 npm 包名 @xlight-oss/visionary-dsh 未被占用

name: Publish DSH Plugin

on:
  push:
    tags:
      - "v*"
  # 手动验证：不发布，只确认 OIDC 令牌能拿到（Trusted Publisher 配置是否正确）。
  # Actions → Publish DSH Plugin → Run workflow → 勾选 verify_oidc_only。
  workflow_dispatch:
    inputs:
      verify_oidc_only:
        description: "只验证 OIDC 令牌可获取（不实际发布）"
        type: boolean
        default: false

jobs:
  publish:
    name: npm publish @xlight-oss/visionary-dsh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC 令牌签发：npm CLI 用它换取短期凭证（Trusted Publishing，免 NPM_TOKEN）
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify versions match (tag / package.json / workspace)
        # 手动验证模式不做版本校验（此时 GITHUB_REF_NAME 是分支名，不是 tag）
        if: ${{ inputs.verify_oidc_only != true }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "import json;print(json.load(open('packages/dsh-plugin/package.json'))['version'])")
          WORKSPACE_VERSION=$(python3 -c "import re;c=open('Cargo.toml',encoding='utf-8').read();m=re.search(r'\[workspace\.package\][^\[]*?version\s*=\s*\"([^\"]+)\"',c,re.S);print(m.group(1))")
          echo "tag: v$TAG | package.json: $PKG_VERSION | workspace: $WORKSPACE_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ] || [ "$TAG" != "$WORKSPACE_VERSION" ]; then
            echo "::error::version mismatch — bump packages/dsh-plugin/package.json to $TAG (see scripts/bump_version.py)"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          # Trusted Publishing 要求 Node >= 22.14.0（npm 11.5.1+ 的运行时）
          node-version: 22
          registry-url: https://registry.npmjs.org
          # 手动验证模式不装依赖，lockfile 缓存路径不存在会让 Post 步骤失败
          cache: ${{ inputs.verify_oidc_only != true && 'pnpm' || '' }}
          cache-dependency-path: packages/dsh-plugin/pnpm-lock.yaml

      - name: Upgrade npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@11.5.1

      # setup-node 的 registry-url 会生成引用 ${NODE_AUTH_TOKEN} 的 .npmrc。
      # 已改为 OIDC 免 token，显式置空该变量，避免 pnpm/清理阶段的 env 替换告警。
      - name: Clear legacy NODE_AUTH_TOKEN reference
        run: |
          CFG="${NPM_CONFIG_USERCONFIG:-}"
          if [ -n "$CFG" ] && [ -f "$CFG" ]; then
            echo 'NODE_AUTH_TOKEN=' >> "$CFG"
            echo "appended empty NODE_AUTH_TOKEN to $CFG"
          else
            echo "NPM_CONFIG_USERCONFIG not set or missing; skipping"
          fi

      # 手动验证模式：确认 GitHub 注入了 OIDC 环境变量、npm 能识别 trusted publishing。
      # 这里只做只读的令牌交换探测，不触碰 registry 写入。
      - name: Verify OIDC environment (manual mode only)
        if: ${{ inputs.verify_oidc_only == true }}
        run: |
          set -euo pipefail
          echo "npm: $(npm -v)  node: $(node -v)"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is unset — id-token: write permission missing"; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is unset"; exit 1; }
          echo "OIDC env vars present."
          # 直接向 GitHub 申请一个 ID token（ proves the OIDC trust relationship works ）
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value // empty')
          test -n "$TOKEN" || { echo "::error::failed to obtain OIDC ID token"; exit 1; }
          echo "OIDC ID token obtained (length ${#TOKEN})."
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss,aud,repository,workflow,ref}' || true

      - name: Install dev dependencies
        if: ${{ inputs.verify_oidc_only != true }}
        run: pnpm install --frozen-lockfile
        working-directory: packages/dsh-plugin

      # 免 token 发布：npm CLI 检测到 GitHub Actions 环境后走 OIDC 换取短期凭证。
      # 刻意不提供 NODE_AUTH_TOKEN —— 让 OIDC 失败时直接报错，而不是静默回退到旧 token。
      # 用 npm 而非 pnpm 发布：OIDC 交换逻辑在 npm CLI 中（pnpm publish 不做 token exchange）。
      - name: Publish to npm (OIDC / trusted publishing)
        if: ${{ inputs.verify_oidc_only != true }}
        run: npm publish --access public
