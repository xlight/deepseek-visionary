# 自动发布 DSH 原生插件包 @xlight-oss/visionary-dsh 到 npm
#
# 触发：push tag vX.Y.Z（与 cargo-dist 二进制发布、Zed 扩展同步同 tag 触发）
# 流程：版本一致性校验（tag == package.json version == workspace Cargo.toml）
#       → pnpm install（锁文件）→ pnpm publish
#
# 前置条件：
#   1. 仓库 secrets 已配置 NPM_TOKEN（npmjs.com → Access Tokens → publish）
#   2. 打 tag 前确认 packages/dsh-plugin/package.json 的 version 与
#      workspace Cargo.toml 一致（workflow 会校验并失败）
#   3. 首次发布需 npm 包名 @xlight-oss/visionary-dsh 未被占用

name: Publish DSH Plugin

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: npm publish @xlight-oss/visionary-dsh
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify versions match (tag / package.json / workspace)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "import json;print(json.load(open('packages/dsh-plugin/package.json'))['version'])")
          WORKSPACE_VERSION=$(python3 -c "import re;c=open('Cargo.toml',encoding='utf-8').read();m=re.search(r'\[workspace\.package\][^\[]*?version\s*=\s*\"([^\"]+)\"',c,re.S);print(m.group(1))")
          echo "tag: v$TAG | package.json: $PKG_VERSION | workspace: $WORKSPACE_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ] || [ "$TAG" != "$WORKSPACE_VERSION" ]; then
            echo "::error::version mismatch — bump packages/dsh-plugin/package.json to $TAG (see scripts/bump_version.py)"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: packages/dsh-plugin/pnpm-lock.yaml

      - name: Install dev dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/dsh-plugin

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public
        working-directory: packages/dsh-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
