# 临时验证 workflow：判定 HOMEBREW_TAP_TOKEN 的类型与授权范围。

name: Verify Homebrew Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: probe token type and scope
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose token
        env:
          TAPE_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -uo pipefail
          H="Authorization: Bearer $TAPE_TOKEN"

          echo '=== 1. token 前缀（判定 classic vs fine-grained）==='
          case "$TAPE_TOKEN" in
            ghp_*)  echo 'CLASSIC token (ghp_)';  KIND=classic ;;
            github_pat_*) echo 'FINE-GRAINED token (github_pat_)'; KIND=fine ;;
            *) echo "UNKNOWN prefix: ${TAPE_TOKEN:0:4}... (len ${#TAPE_TOKEN})"; KIND=unknown ;;
          esac

          echo '=== 2. token 自身的 scopes（仅 classic 响应头有 X-OAuth-Scopes）==='
          curl -sS -D - -o /dev/null -H "$H" https://api.github.com/user \
            | grep -iE 'x-oauth-scopes|x-accepted' || echo '  (无 X-OAuth-Scopes 响应头 → 不是 classic token)'

          echo '=== 3. fine-grained token 的仓库授权列表 ==='
          if [ "$KIND" = fine ]; then
            curl -sS -H "$H" 'https://api.github.com/user/installations?per_page=100' \
              | jq -r 'if .installations then (.installations|length|tostring) + " installation(s)" else ("ERROR: " + (.message // "?")) end'
            # 关键：列出该 token 被授权访问的仓库
            curl -sS -H "$H" 'https://api.github.com/installation/repositories?per_page=100' \
              | jq -r 'if .repositories then ([.repositories[].full_name] | join(", ")) else ("ERROR: " + (.message // "?")) end'
          fi

          echo '=== 4. git push --dry-run（真正的写权限判定）==='
          git config --global user.email ci@example.com
          git config --global user.name ci
          git clone --quiet --depth 1 "https://x-access-token:${TAPE_TOKEN}@github.com/xlight/homebrew-tap.git" tap 2>&1 | tail -2
          cd tap && git commit --allow-empty -q -m probe
          if git push --dry-run origin HEAD 2>&1; then
            echo 'WRITE OK'
          else
            echo 'WRITE DENIED'
          fi
