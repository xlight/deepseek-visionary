[workspace]
resolver = "2"
members = ["crates/dsv-server", "crates/dsv-zed-ext"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-org/deepseek-vision-rs"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"] }
wasmtime = "37"
anyhow = "1"
thiserror = "2"
